<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Scan QR Santri</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    h2 {
      margin-top: 10px;
      margin-bottom: 8px;
    }

    .info {
      margin-bottom: 20px;
      color: #666;
      font-size: 14px;
    }

    #reader {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      padding: 10px;
      overflow: hidden;
    }

    #hasil {
      display: none;
      max-width: 420px;
      margin: 20px auto 0;
      padding: 15px;
      background: #ffffff;
      border-radius: 12px;
    }

    #hasilId {
      font-size: 24px;
      font-weight: bold;
      margin: 8px 0;
    }

    .tombol {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    #btnKembali {
      background: #333;
      color: white;
    }

    #status {
      margin-top: 15px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>

<body>

  <h2>SCAN QR SANTRI</h2>

  <div class="info">
    Arahkan kamera ke QR Code santri
  </div>

  <div id="reader"></div>

  <div id="status">
    Memulai kamera...
  </div>

  <div id="hasil">

    <div>ID SANTRI TERBACA</div>

    <div id="hasilId"></div>

    <button
      id="btnKembali"
      class="tombol"
      onclick="kembaliKeKasir()">
      KEMBALI KE KASIR
    </button>

  </div>


  <script>

    let scanner = null;

let sudahScan = false;


// URL Web App Bathik SantriPay
const KASIR_URL =
  "https://script.google.com/macros/s/AKfycbzOaCgM6CgPCWMR0r4Mr2CXjBV-0vusdYflQE8HMPY3RMuEY4ZQ4-Ec0z0ftoJ3NQ/exec";


// URL Login Petugas
const LOGIN_PETUGAS_URL =
  KASIR_URL + "?page=LoginPetugas";


// Cek sesi petugas sebelum membuka kamera
function cekSesiPetugas() {

  /*
   * Ambil token dari URL.
   *
   * Token dikirim oleh halaman Login Petugas
   * melalui:
   *
   * ?token=TOKEN
   */
  const parameterURL =
    new URLSearchParams(
      window.location.search
    );

  const tokenDariURL =
    parameterURL.get("token");


  /*
   * Jika ada token dari URL,
   * simpan ke sessionStorage Scanner.
   */
  if (tokenDariURL) {

    sessionStorage.setItem(
      "bathikPetugasToken",
      tokenDariURL
    );

    /*
     * Bersihkan token dari alamat browser
     * setelah berhasil disimpan.
     */
    window.history.replaceState(
      {},
      document.title,
      window.location.pathname
    );

  }


  /*
   * Sekarang ambil token dari
   * sessionStorage Scanner.
   */
  const token =
    sessionStorage.getItem(
      "bathikPetugasToken"
    );


  /*
   * Tidak ada token sama sekali
   * → kembali ke Login Petugas.
   */
  if (!token) {

    window.location.href =
      LOGIN_PETUGAS_URL;

    return;
  }


  /*
   * Validasi token ke Apps Script.
   */
  const urlValidasi =
    KASIR_URL +
    "?action=validasiPetugas" +
    "&token=" +
    encodeURIComponent(
      token
    );


  fetch(urlValidasi)

    .then(function(response) {

      return response.json();

    })

    .then(function(hasil) {


      /*
       * Token tidak valid
       * → hapus sesi dan kembali login.
       */
      if (
        !hasil ||
        !hasil.berhasil
      ) {

        sessionStorage.removeItem(
          "bathikPetugasToken"
        );

        sessionStorage.removeItem(
          "bathikPetugasId"
        );

        sessionStorage.removeItem(
          "bathikPetugasNama"
        );

        sessionStorage.removeItem(
          "bathikPetugasRole"
        );


        window.location.href =
          LOGIN_PETUGAS_URL;

        return;
      }


      /*
       * Sesi valid.
       *
       * Simpan kembali data petugas
       * agar tersedia selama sesi Scanner.
       */
      sessionStorage.setItem(
        "bathikPetugasId",
        hasil.idPetugas
      );

      sessionStorage.setItem(
        "bathikPetugasNama",
        hasil.nama
      );

      sessionStorage.setItem(
        "bathikPetugasRole",
        hasil.role
      );


      /*
       * Sesi valid → buka kamera.
       */
      document.getElementById(
        "status"
      ).textContent =
        "Login sebagai " +
        hasil.nama +
        ". Memulai kamera...";


      mulaiScanner();

    })


    .catch(function(error) {

      document.getElementById(
        "status"
      ).textContent =
        "Gagal memeriksa sesi petugas.";

      console.error(error);

    });

}

    function mulaiScanner() {

      scanner = new Html5Qrcode("reader");

      const config = {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        },
        aspectRatio: 1.0
      };

      scanner.start(
        {
          facingMode: "environment"
        },

        config,

        function(decodedText) {

          if (sudahScan) {
            return;
          }

          sudahScan = true;

          const idSantri = decodedText.trim();

          document.getElementById("hasilId").textContent =
            idSantri;

          document.getElementById("hasil").style.display =
            "block";

          document.getElementById("status").textContent =
            "QR berhasil dibaca.";

          scanner.stop().then(function() {

            /*
             * Untuk tahap pertama kita hanya
             * menampilkan ID yang berhasil dibaca.
             *
             * Setelah scanner terbukti bekerja,
             * kita sambungkan kembali ke halaman kasir.
             */

          }).catch(function(error) {

            console.log(error);

          });

        },

        function(errorMessage) {

          // Error scanning biasa diabaikan.
          // Kamera tetap berjalan.

        }

      ).catch(function(error) {

        document.getElementById("status").textContent =
          "Kamera tidak dapat dibuka: " + error;

      });

    }


    function kembaliKeKasir() {

      window.history.back();

    }
    window.addEventListener(
  "load",
  function() {

    cekSesiPetugas();

  }
);

  </script>

</body>
</html>
