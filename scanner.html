```html
<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Scan QR Santri</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    h2 {
      margin-top: 10px;
      margin-bottom: 8px;
    }

    .info {
      margin-bottom: 20px;
      color: #666;
      font-size: 14px;
    }

    #reader {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      padding: 10px;
      overflow: hidden;
    }

    #status {
      margin-top: 15px;
      font-size: 14px;
      color: #555;
    }

  </style>

</head>

<body>

  <h2>SCAN QR SANTRI</h2>

  <div class="info">
    Arahkan kamera ke QR Code santri
  </div>

  <div id="reader"></div>

  <div id="status">
    Memeriksa sesi petugas...
  </div>


  <script>

    let scanner = null;
    let sudahScan = false;


    const KASIR_URL =
      "https://script.google.com/macros/s/AKfycbzOaCgM6CgPCWMR0r4Mr2CXjBV-0vusdYflQE8HMPY3MuEY4ZQ4-Ec0z0ftoJ3NQ/exec";


    /*
     * Memeriksa token yang ada di URL.
     */
    function cekSesiPetugas() {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const token =
        String(
          params.get("token") || ""
        ).trim();


      if (!token) {

        document.getElementById(
          "status"
        ).textContent =
          "ERROR: Token petugas tidak ditemukan.";

        return;

      }


      /*
       * Simpan token.
       */
      sessionStorage.setItem(
        "bathikPetugasToken",
        token
      );


      /*
       * Buat URL validasi.
       */
      const urlValidasi =
        KASIR_URL +
        "?action=validasiPetugas" +
        "&token=" +
        encodeURIComponent(token);


      /*
       * Gunakan JSONP.
       *
       * Apps Script sering melakukan redirect.
       * JSONP menghindari masalah CORS
       * dari fetch() pada GitHub Pages.
       */
      const namaCallback =
        "validasiPetugasCallback";


      window[namaCallback] =
        function(hasil) {

          /*
           * Hapus script JSONP.
           */
          const script =
            document.getElementById(
              "scriptValidasiPetugas"
            );

          if (script) {
            script.remove();
          }


          if (
            !hasil ||
            !hasil.berhasil
          ) {

            sessionStorage.removeItem(
              "bathikPetugasToken"
            );

            document.getElementById(
              "status"
            ).textContent =
              "ERROR: Token ditolak server.";

            return;

          }


          /*
           * Simpan data petugas.
           */
          sessionStorage.setItem(
            "bathikPetugasId",
            hasil.idPetugas || ""
          );

          sessionStorage.setItem(
            "bathikPetugasNama",
            hasil.nama || ""
          );

          sessionStorage.setItem(
            "bathikPetugasRole",
            hasil.role || ""
          );


          document.getElementById(
            "status"
          ).textContent =
            "Login sebagai " +
            hasil.nama +
            ". Memulai kamera...";


          mulaiScanner();

        };


      /*
       * Tambahkan parameter callback.
       */
      const script =
        document.createElement(
          "script"
        );


      script.id =
        "scriptValidasiPetugas";


      script.src =
        urlValidasi +
        "&callback=" +
        namaCallback;


      script.onerror =
        function() {

          document.getElementById(
            "status"
          ).textContent =
            "ERROR: Gagal menghubungi server.";

        };


      document.body.appendChild(
        script
      );

    }


    /*
     * MULAI KAMERA
     */
    function mulaiScanner() {

      scanner =
        new Html5Qrcode(
          "reader"
        );


      const config = {

        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        },

        aspectRatio: 1.0

      };


      scanner.start(

        {
          facingMode:
            "environment"
        },

        config,


        function(decodedText) {

          if (sudahScan) {
            return;
          }


          sudahScan = true;


          const idSantri =
            String(
              decodedText || ""
            ).trim();


          if (!idSantri) {

            sudahScan = false;

            return;

          }


          document.getElementById(
            "status"
          ).textContent =
            "QR terbaca. Membuka halaman kasir...";


          /*
           * Hentikan kamera,
           * lalu buka halaman Kasir.
           */
          scanner.stop()

            .then(function() {

              const urlKasir =
                KASIR_URL +
                "?id=" +
                encodeURIComponent(
                  idSantri
                );


              window.location.href =
                urlKasir;

            })

            .catch(function(error) {

              console.error(error);


              const urlKasir =
                KASIR_URL +
                "?id=" +
                encodeURIComponent(
                  idSantri
                );


              window.location.href =
                urlKasir;

            });

        },


        function(errorMessage) {

          /*
           * Error scanning biasa
           * tidak perlu ditampilkan.
           */

        }

      )

      .catch(function(error) {

        console.error(error);

        document.getElementById(
          "status"
        ).textContent =
          "Kamera tidak dapat dibuka: " +
          error;

      });

    }


    window.addEventListener(
      "load",
      function() {

        cekSesiPetugas();

      }
    );

  </script>

</body>
</html>
